<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
      <meta name="google" content="notranslate" />
      <link rel="manifest" href="/manifest.json" />

    <link rel="icon" type="image/svg+xml" href="/icon-51266.png" />
    
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css"
/>

    <title>Zaldemy</title>

    <style>
      html, body {
        margin: 0;
        padding: 0;
      }
      #initial-loader {
        display: flex;
        height: 100vh;
        width: 100vw;
        align-items: center;
        justify-content: center;
        background: linear-gradient(to bottom right, #111827, #1f2937);
      }
      #initial-loader img {
        width: 7rem;
        animation: initial-loader-pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }
      @keyframes initial-loader-pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-loader">
        <img src="/loading-icon.png" alt="Loading" />
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
